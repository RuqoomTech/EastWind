name: EastWind CI

# CI for the EastWind development branch. Zero Hour only.
# Kept separate from upstream's ci.yml so merges from upstream stay conflict free.

permissions:
  contents: read

on:
  push:
    branches:
      - eastwind/**
  pull_request:
    branches:
      - eastwind/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-generalsmd-win32:
    name: Build GeneralsMD${{ matrix.preset && '' }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - preset: "win32"
            tools: true
            extras: true
          - preset: "win32-debug"
            tools: true
            extras: true
      fail-fast: false
    uses: ./.github/workflows/reusable-build-toolchain.yml
    with:
      game: "GeneralsMD"
      preset: ${{ matrix.preset }}
      tools: ${{ matrix.tools }}
      extras: ${{ matrix.extras }}
      tests: true
    secrets: inherit

  # The reusable workflow only sets up MSVC for win32 presets, so win64 has its own steps here.
  build-generalsmd-win64:
    name: Build GeneralsMD (${{ matrix.preset }}+t+e)
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # vcpkg binary cache uploads, as in upstream's vcpkg jobs
    strategy:
      matrix:
        preset: ["win64", "win64-debug", "win64-vcpkg"]
      fail-fast: false
    env:
      # Same vcpkg binary cache as the reusable workflow, so FFmpeg is built once and then restored.
      VCPKG_BINARY_SOURCES: "clear;nuget,https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json,${{ github.event.pull_request.head.repo.fork && 'read' || 'readwrite' }}"
      VCPKG_NUGET_REPOSITORY: "https://github.com/${{ github.repository }}.git"
      VCPKG_FEATURE_FLAGS: manifests,versions,binarycaching
      VCPKG_DISABLE_METRICS: "1"
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Cache CMake Dependencies
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: build\${{ matrix.preset }}\_deps
          key: cmake-deps-${{ matrix.preset }}-${{ hashFiles('CMakePresets.json','cmake/**/*.cmake','**/CMakeLists.txt') }}

      - name: Set Up VC2022 Environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Setup vcpkg
        if: contains(matrix.preset, 'vcpkg')
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          runVcpkgInstall: false
          doNotCache: true

      - name: Configure NuGet Source for vcpkg Binary Cache
        if: contains(matrix.preset, 'vcpkg')
        shell: pwsh
        run: |
          $nuget = & "$env:VCPKG_ROOT\vcpkg.exe" fetch nuget | Select-Object -Last 1
          & $nuget sources add `
            -Source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" `
            -StorePasswordInClearText `
            -Name GitHubPackages `
            -UserName "${{ github.repository_owner }}" `
            -Password "${{ secrets.GITHUB_TOKEN }}"
          & $nuget setapikey "${{ secrets.GITHUB_TOKEN }}" `
            -Source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          "VCPKG_INSTALL_OPTIONS=--x-abi-tools-use-exact-versions" >> $env:GITHUB_ENV

      - name: Configure
        shell: pwsh
        run: |
          cmake --preset ${{ matrix.preset }} `
            -DRTS_BUILD_ZEROHOUR=ON `
            -DRTS_BUILD_CORE_TOOLS=ON -DRTS_BUILD_ZEROHOUR_TOOLS=ON `
            -DRTS_BUILD_CORE_EXTRAS=ON -DRTS_BUILD_ZEROHOUR_EXTRAS=ON `
            -DRTS_BUILD_OPTION_TESTS=ON

      - name: Build
        shell: pwsh
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        shell: pwsh
        run: ctest --preset ${{ matrix.preset }} --verbose
