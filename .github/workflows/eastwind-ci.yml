name: EastWind CI

# CI for the EastWind development branch. Zero Hour only.
# Kept separate from upstream's ci.yml so merges from upstream stay conflict free.

permissions:
  contents: read

on:
  push:
    branches:
      - eastwind/**
  pull_request:
    branches:
      - eastwind/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-generalsmd-win32:
    name: Build GeneralsMD${{ matrix.preset && '' }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - preset: "win32"
            tools: true
            extras: true
          - preset: "win32-debug"
            tools: true
            extras: true
      fail-fast: false
    uses: ./.github/workflows/reusable-build-toolchain.yml
    with:
      game: "GeneralsMD"
      preset: ${{ matrix.preset }}
      tools: ${{ matrix.tools }}
      extras: ${{ matrix.extras }}
      tests: true
    secrets: inherit
